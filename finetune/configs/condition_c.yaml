experiment:
  name: "condition_c_medvae_finetuned"
  condition: "C"
  seed: 42

data:
  train_images: "dataset_phase_1/segmentation_dataset/seg_train/images"
  train_ann:    "dataset_phase_1/segmentation_dataset/seg_train/annotations/seg_train.json"
  val_images:   "dataset_final_phase/test_case_segmentation/images"
  val_ann:      "dataset_final_phase/test_case_segmentation/annotations/instances_default.json"
  train_ratio:  0.8
  num_classes:  26
  img_size:     512
  num_workers:  4
  pin_memory:   true

# Encodeur MedVAE
# checkpoint_path: "path.ckpt" correspond aux poids fine-tunés sur ARCADE    
encoder:
  model_name:      "medvae_4_1_2d"   # f=4 par dim spatiale, 1 canal latent
  modality:        "xray"
  checkpoint_path: null   # fourni au lancement : --set encoder.checkpoint_path=<run medvae_finetune>/best_medvae_finetuned.pth

# Tête de segmentation légère (identique à condition B)
model:
  architecture:    "seg_head"
  latent_channels: 1            # 1 canal latent (medvae_4_1_2d)
  num_classes:     26
  base_channels:   128
  n_upsample:      2            # 128 → 256 → 512 (f=4 spatial, 2 × ×2)

training:
  epochs:                   100
  batch_size:               4
  learning_rate:            5.0e-5
  weight_decay:             1.0e-4
  early_stopping_patience:  15
  grad_clip:                1.0

scheduler:
  name: "cosine"
  cosine:
    T_max:   100
    eta_min: 1.0e-6
  plateau:
    factor:   0.5
    patience: 7
    min_lr:   1.0e-6

loss:
  dice_weight: 0.5
  ce_weight:   0.5
  cl_weight:   0.0

logging:
  save_dir: null   # défini au lancement : experiments/runs/<date>_<nom>/
