experiment:
  name: "condition_r_downsampled"
  condition: "R"
  seed: 42

data:
  train_images: "dataset_phase_1/segmentation_dataset/seg_train/images"
  train_ann:    "dataset_phase_1/segmentation_dataset/seg_train/annotations/seg_train.json"
  val_images:   "dataset_final_phase/test_case_segmentation/images"
  val_ann:      "dataset_final_phase/test_case_segmentation/annotations/instances_default.json"
  train_ratio:  0.8        # utilisé seulement si validation: split
  num_classes:  26
  img_size:     512
  num_workers:  4
  pin_memory:   true
  validation:   official          # E08 : entraînement sur tout seg_train, sélection sur seg_val
  gauss_noise_std_range: [0.0124, 0.0277]   # E07 : bruit léger (écart-type ~3-7 / 255)

# Témoin E16 : même tête que B et C, sur l'image réduite à 128×128 (moyenne 4×4)
# au lieu du latent MedVAE : autant de valeurs en entrée, sans MedVAE
model:
  architecture:   "latent_unet_head"
  latent_channels: 1            # image en niveaux de gris
  num_classes:     26
  base_channels:   64
  n_upsample:      2            # 128 → 256 → 512 (2 upsampling ×2, f=4 par dim)

training:
  epochs:                   100
  batch_size:               4
  learning_rate:            1.0e-3   # E03 : 5e-5 bloquait la tête sur « tout est du fond »
  weight_decay:             1.0e-4
  early_stopping_patience:  15
  grad_clip:                1.0

scheduler:
  name: "cosine"
  cosine:
    T_max:   100
    eta_min: 1.0e-6
  plateau:
    factor:   0.5
    patience: 7
    min_lr:   1.0e-6

loss:
  dice_weight: 0.5
  ce_weight:   0.5
  cl_weight:   0.0

logging:
  save_dir: null   # défini au lancement : experiments/runs/<date>_<nom>/
