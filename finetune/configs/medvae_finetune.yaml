encoder:
  model_name: "medvae_4_1_2d"
  modality:   "xray"

data:
  train_images: "dataset_phase_1/segmentation_dataset/seg_train/images"
  img_size:     512
  val_ratio:    0.1        # 10 % des images train → validation
  num_workers:  4
  pin_memory:   true

training:
  epochs:                   50
  batch_size:               4
  micro_batch_size:         1        # accumulation de gradient : batch de 4 en 4 × 1 (RTX 3090, 24 Go)
  learning_rate:            4.5e-6   # petit LR : fine-tuning, pas training from scratch
  weight_decay:             0.0
  lr_min:                   1.0e-7
  early_stopping_patience:  10
  grad_clip:                1.0

logging:
  save_dir: null   # défini au lancement : experiments/runs/<date>_<nom>/
