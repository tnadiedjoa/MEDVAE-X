data:
  source: arcade
  img_size: 512
  val_ratio: 0.1
  augment: true
  seed: 42
  loader:
    batch_size: 2
    num_workers: 4
    pin_memory: true
training:
  device: auto
  seed: 42
  amp: true
  epochs: 15
  output_dir: jepa_adaptation/outputs/stage1
  log_every: 200
  save_every: 5
  optimizer:
    name: adamw
    lr: 4.5e-05
    weight_decay: 0.0
  disc_optimizer:
    name: adamw
    lr: 4.5e-06
    weight_decay: 0.0
  loss:
    disc_start: 5001
    kl_weight: 1.0e-06
    disc_weight: 0.5
    perceptual_weight: 1.0
    num_channels: 3
    learn_logvar: false
model:
  spatial_dims: 2
  embed_dim: 1
  apply_channel_ds: true
  medvae_pretrained: null
  ckpt_path: null
  ddconfig:
    double_z: true
    z_channels: 1
    resolution: 512
    in_channels: 1
    out_ch: 1
    ch: 64
    ch_mult:
    - 1
    - 2
    - 4
    - 4
    num_res_blocks: 2
    attn_resolutions: []
    dropout: 0.0
jepa:
  patch_size: 16
  target_mask_ratio: 0.4
  predictor_hidden_dim: null
  predictor_depth: 3
  ema_momentum: 0.996
  sample_posterior: false
  freeze_decoder: true
  freeze_encoder: false
  use_penultimate: true
