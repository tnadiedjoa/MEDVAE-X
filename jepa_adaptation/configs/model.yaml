model:
  spatial_dims: 2
  embed_dim: 4
  apply_channel_ds: true
  medvae_pretrained: null
  ckpt_path: null
  ddconfig:
    double_z: true
    z_channels: 4
    resolution: 224
    in_channels: 1
    out_ch: 1
    ch: 128
    ch_mult: [1, 2, 4]
    num_res_blocks: 2
    attn_resolutions: []
    dropout: 0.0

jepa:
  patch_size: 16
  target_mask_ratio: 0.4
  predictor_hidden_dim: 128
  predictor_depth: 3
  ema_momentum: 0.996
  sample_posterior: false
  freeze_decoder: true
