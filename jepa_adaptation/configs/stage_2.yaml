data:
  source: arcade      # "arcade" | "medmnist"
  img_size: 512
  val_ratio: 0.1
  augment: true
  seed: 42
  loader:
    batch_size: 4
    num_workers: 4
    pin_memory: true

training:
  device: auto
  seed: 42
  amp: true
  epochs: 15
  output_dir: jepa_adaptation/outputs/stage2
  log_every: 50
  save_every: 5
  max_grad_norm: 1.0
  stage1_ckpt: jepa_adaptation/outputs/stage1/best.pt

  optimizer:
    name: adamw
    lr: 2.0e-5
    weight_decay: 1.0e-4

  loss:
    loss_type: smooth_l1
    normalize: true
    sigreg_weight: 0.01
    num_projections: 64
    max_tokens: 512
